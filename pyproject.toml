[project]
name = "fin-scrape"
version = "0.3.0"
description = "AI-powered financial news intelligence engine with vendored Scrapling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Vendored Scrapling engine dependencies
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "curl-cffi>=0.7.0",
    "orjson>=3.9.0",
    "w3lib>=2.1.0",
    "tld>=0.13.0",
    "browserforge>=1.1.0",
    "patchright>=1.0.0",
    "msgspec>=0.18.0",
    "typing-extensions>=4.0.0",
    # Core
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "requests>=2.31.0",
    # RSS parsing
    "feedparser>=6.0.0",
    # Financial data
    "yfinance>=0.2.30",
    "pytest>=9.0.3",
    "spacy>=3.8.14",
    "trafilatura>=2.2.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# Sector/direction classifier. `laya` runs on PyTorch anywhere; `laya-mlx` only on Apple Silicon.
laya = [
    "laya>=0.3.20; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "laya-mlx>=0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    # Starlette's TestClient deprecates plain httpx in favour of httpx2.
    "httpx2>=2.13",
    # Pinned: uv.lock is not committed, so an open range let CI pick up new default
    # lint rules between runs. Upgrade deliberately and fix findings in the same change.
    "ruff==0.16.9",
    "pyright==1.1.411",
    "pyarrow>=25.0.1",
]
# WorldFin backend (server/). Kept out of core deps so the finscrape CLI install
# stays lean; `uv sync --group server` to work on the API.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
    "redis>=5.0",
]

# Scoped to the WorldFin backend only. The legacy finscrape/ core (~24k LOC) carries
# type debt that would red-gate the whole repo, so pyright covers server/ + worker/ —
# the new, typed code — while ruff handles lint everywhere. Run via `make typecheck`.
[tool.pyright]
include = ["server", "worker"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true

# Absorbed feature code (see finscrape/absorbed/ABSORBED.md) is vendored
# reference material pending wiring — keep it out of lint gates.
[tool.ruff]
extend-exclude = ["finscrape/absorbed"]

# FastAPI reads these defaults as parameter declarations; they are never shared state.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Query"]

# Keep pytest scoped to the real suite; absorbed/ holds 31k vendored files.
[tool.pytest.ini_options]
testpaths = ["tests"]

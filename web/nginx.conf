server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Looser CSP than the API's `default-src 'none'`: the SPA loads Google Fonts and
  # globe textures, embeds YouTube, and the landing page frames /app/.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https: wss:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'" always;

  # API + WebSocket → the FastAPI service (same-origin for the SPA).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Append the peer address to any inbound chain. The API reads the rightmost hop
    # for rate limiting, which is only meaningful because this proxy writes it.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

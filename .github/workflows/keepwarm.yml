name: keepwarm

# Render's free tier sleeps after 15 idle minutes and takes 30-50 s to wake, which is
# what a first visitor would see. Weekday working hours only (02:00-18:00 UTC, about
# 350 h/month) so the workspace's 750 free hours also cover the other service.
# Before a demo outside those hours: gh workflow run keepwarm.yml
on:
  schedule:
    - cron: "*/10 2-17 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://winfin-api.onrender.com/health

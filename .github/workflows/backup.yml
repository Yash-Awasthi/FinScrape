name: backup

# Supabase free keeps no backups; a nightly dump, encrypted with BACKUP_KEY (also in the
# owner's .env) because artifacts of a public repo are readable, is kept for 14 days.
# The cron Worker `winfin-ingest-cron` dispatches it at 21:20 UTC.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Dump production with pg_dump 17 and encrypt it
        env:
          WORLDFIN_DATABASE_URL: ${{ secrets.WORLDFIN_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          # Registry pulls hit anonymous rate limits (Docker Hub, ECR); PGDG apt has none.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump "$WORLDFIN_DATABASE_URL" -Fc --no-owner > worldfin.dump
          test -s worldfin.dump
          openssl enc -aes-256-cbc -pbkdf2 -pass env:BACKUP_KEY -in worldfin.dump -out worldfin.dump.enc
          ls -lh worldfin.dump.enc
      - uses: actions/upload-artifact@v7
        with:
          name: worldfin-${{ github.run_id }}
          path: worldfin.dump.enc
          retention-days: 14

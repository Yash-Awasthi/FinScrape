name: deploy-web

# Builds web/ against the Render API and publishes it to Cloudflare Pages (`winfin`).
# Needs the CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets;
# without them the job says so and stops, so master pushes stay green.
on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping the Pages deploy"
          fi
        working-directory: .
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.creds.outputs.ok
      - run: npm run build
        if: steps.creds.outputs.ok
        env:
          VITE_API_BASE: https://winfin-api.onrender.com
      - run: npx --yes wrangler@4 pages deploy dist --project-name=winfin --branch=main
        if: steps.creds.outputs.ok

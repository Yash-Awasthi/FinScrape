name: CI

# The quality contract is the Makefile's `ci` target: lint, fmt-check, typecheck,
# selfcheck, test, web-ci, e2e. This workflow runs those same commands so a green
# check means the same thing locally and here.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to a PR supersedes the run on the previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: worldfin
          POSTGRES_PASSWORD: worldfin
          POSTGRES_DB: worldfin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worldfin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WORLDFIN_TEST_DATABASE_URL: postgresql://worldfin:worldfin@127.0.0.1:5432/worldfin_test
      WORLDFIN_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          groups: --group server --group dev

      # NEW_DIRS from the Makefile — the vendored finscrape/ tree carries pre-existing
      # lint debt and is out of scope by design (see pyproject [tool.ruff]).
      - name: Lint
        run: make lint
      - name: Format check
        run: make fmt-check
      - name: Typecheck
        run: uv run -p 3.14 pyright
      # ty is pre-1.0; it reports next to pyright without gating the build.
      - name: Typecheck (ty)
        continue-on-error: true
        run: uv run -p 3.14 ty check server worker
      - name: Selfcheck
        run: uv run -p 3.14 python -m tests.server.selfcheck
      - name: Test
        run: uv run -p 3.14 pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: node --test ../ops/ingest-cron/index.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures
          # The CI reporter is "list", so there is no HTML report — test-results holds
          # the traces and screenshots Playwright writes for a failing spec.
          path: web/test-results
          retention-days: 7

  e2e-live:
    # The built SPA against the real API and a seeded Postgres (`make e2e-live`).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: worldfin
          POSTGRES_PASSWORD: worldfin
          POSTGRES_DB: worldfin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worldfin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WORLDFIN_TEST_DATABASE_URL: postgresql://worldfin:worldfin@127.0.0.1:5432/worldfin_test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # tests/live_e2e.py serves the API on uvicorn, which lives in the dev group.
      - uses: ./.github/actions/setup-python
        with:
          groups: --group server --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-live-failures
          path: web/test-results
          retention-days: 7

  free-threaded:
    # Side job for the 3.14t build: a native extension without free-threaded support
    # silently re-enables the GIL, so the import check fails if that happens.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked -p 3.14t --group server --group dev
      - run: uv run --no-sync python -c "import sys, lxml.etree, curl_cffi, orjson, msgspec; assert not sys._is_gil_enabled()"
      - run: uv run --no-sync pytest -q

  images:
    # `make demo` builds these three; a broken Dockerfile should fail here, not there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.api -t fin-scrape-api:scan .
      - run: docker build -f Dockerfile.worker .
      - run: docker build web
      - name: Trivy scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fin-scrape-api:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

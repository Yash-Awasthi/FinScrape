name: CI

# The quality contract is the Makefile's `ci` target: lint, fmt-check, typecheck,
# selfcheck, test, web-ci, e2e. This workflow runs those same commands so a green
# check means the same thing locally and here.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to a PR supersedes the run on the previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    # Every subject in the pull request has to render, otherwise the generated
    # CHANGELOG.md would silently lose the commit at release time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the pull request's commit subjects
        # No setup-python here: the runner's own python3 is enough for a stdlib script.
        run: python3 ops/release/changelog.py --check-range "origin/${{ github.base_ref }}..HEAD"

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: worldfin
          POSTGRES_PASSWORD: worldfin
          POSTGRES_DB: worldfin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worldfin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WORLDFIN_TEST_DATABASE_URL: postgresql://worldfin:worldfin@127.0.0.1:5432/worldfin_test
      WORLDFIN_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          groups: --group server --group dev

      # ruff covers the whole tree; the per-file allowlist in ruff-baseline.toml is what keeps
      # the vendored finscrape/ debt from moving (see pyproject [tool.ruff]).
      - name: Lint
        run: make lint
      - name: Format check
        run: make fmt-check
      - name: Typecheck
        run: uv run -p 3.14 pyright
      # pyright now covers finscrape/ too, which carries 58 pre-existing errors. The committed
      # fingerprint in pyright-baseline.json is the gate: new debt fails, shrinking is free.
      - name: Type-debt ratchet
        run: uv run -p 3.14 --group dev python -m scripts.pyright_baseline --check
      # ty is pre-1.0, but its scope (the new, typed code) is at zero diagnostics, so it is a
      # gate now. finscrape/ is deliberately out of ty's scope: 236 diagnostics of vendored
      # pandas/lxml/typing pattern noise there, while pyright is clean over the whole tree.
      - name: Typecheck (ty)
        run: uv run -p 3.14 ty check server worker
      - name: Selfcheck
        run: uv run -p 3.14 python -m tests.server.selfcheck
      # plan M2.2: the contract clients read is pinned. A removed path, a dropped response
      # field or a tightened bound fails here, before a panel goes quietly empty.
      - name: Stack doc against the pins
        run: make stack-check
      - name: API contract
        run: make openapi-check
      # plan M6.4: one review per quarter, enforced by age rather than by a repository
      # schedule (GitHub disables those after 60 quiet days; the cron Worker is the only
      # scheduler). A stale block or a review older than 100 days fails every CI run.
      - name: Quarterly review freshness
        run: python ops/review/review.py --check --max-age-days 100
      - name: Test
        run: uv run -p 3.14 pytest -q

  server-group:
    # plan M3.1: one dependency source. The `server` group must be enough to import the
    # API and the worker on its own — otherwise a missing runtime dependency hides behind
    # the dev group that every other job installs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          # --no-default-groups matters: otherwise uv also installs the `dev` group and
          # the check would pass on pytest/uvicorn while a runtime import is missing.
          groups: --no-default-groups --group server
      - name: Server group alone imports the app
        run: python -c "import server.app, worker.main, finscrape.scrapers; print('server group self-sufficient')"

  eval-gate:
    # plan M2.1: any model or prompt change must hold its score on the frozen gold set
    # (tests/gold/). The gate replays a recorded run, so it needs no network and no
    # credentials — and because the recording carries a prompt fingerprint, editing a
    # prompt without re-recording fails here instead of scoring yesterday's text.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          groups: --group server --group dev
      - name: Score the gold set offline
        run: make eval-gate

  supply-chain:
    # plan M2.4: an unallowlisted advisory fails the build, and so does an allowlist entry
    # whose expiry has passed. Both halves of the tree are audited, because a vulnerable
    # npm dev-dependency in the web image is still shipped bytes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          groups: --group server --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Audit the lock file and the web dependencies
        run: make audit
      - name: SBOM from the lock file
        run: make sbom

  docs-drift:
    # Every count the docs quote must still be the count the tree produces. The job
    # regenerates the facts blocks and fails on any diff, so a stale number is caught
    # by the same pull request that changed it (`make facts` fixes it).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          groups: --group server --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The script counts Vitest and Playwright specs, so the CLIs must be installed.
      - run: npm ci
        working-directory: web
      - name: Regenerate the facts blocks
        run: make facts
      - name: Fail on drift
        run: git diff --exit-code

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: node --test ../ops/ingest-cron/index.test.mjs
      - run: npm run build
      - run: npm run budget
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures
          # The CI reporter is "list", so there is no HTML report — test-results holds
          # the traces and screenshots Playwright writes for a failing spec.
          path: web/test-results
          retention-days: 7

  e2e-live:
    # The built SPA against the real API and a seeded Postgres (`make e2e-live`).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: worldfin
          POSTGRES_PASSWORD: worldfin
          POSTGRES_DB: worldfin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worldfin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WORLDFIN_TEST_DATABASE_URL: postgresql://worldfin:worldfin@127.0.0.1:5432/worldfin_test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # tests/live_e2e.py serves the API on uvicorn, which lives in the dev group.
      - uses: ./.github/actions/setup-python
        with:
          groups: --group server --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-live-failures
          path: web/test-results
          retention-days: 7

  images:
    # `make demo` builds these three; a broken Dockerfile should fail here, not there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.api -t fin-scrape-api:scan .
      - run: docker build -f Dockerfile.worker .
      - run: docker build web
      - name: Trivy scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fin-scrape-api:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

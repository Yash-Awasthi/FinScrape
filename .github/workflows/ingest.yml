name: ingest

# Free no-host worker: a scheduled runner does ONE ingest cycle (scrape -> LLM ->
# ingest -> correlate -> backtest) against Neon, then exits. Replaces an always-on
# worker process. Unlimited minutes on public repos. Off-peak minutes (:13/:43)
# reduce GitHub's start-of-hour scheduling delay.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORLDFIN_DATABASE_URL: ${{ secrets.WORLDFIN_DATABASE_URL }}
      # Free models via TokenHarbor (OpenAI chat API). Heuristic fallback (below) still
      # covers any LLM outage so events always land.
      OPENAI_BASE_URL: https://tokenharbor.ai/v1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FINSCRAPE_WIRE_API: chat
      # Most accurate on the sector gold set (80%) but a fifth of calls fail or time
      # out, so mimo (96% valid) takes over; see docs/DEPLOY.md.
      FINSCRAPE_MODEL: qwen3.8-flash:free
      FINSCRAPE_MODEL_FALLBACK: mimo-v2.6-flash:free
      FINSCRAPE_HEURISTIC_FALLBACK: "true"
      WORLDFIN_WORKER_MAX_ARTICLES: "6"
      WORLDFIN_ENABLE_CORRELATION: "true"
      FINSCRAPE_MARKET_TTL: "900"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.13
      - name: Run one ingest cycle
        run: uv run -p 3.13 --group server python -m worker.main --once

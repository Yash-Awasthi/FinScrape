name: ingest

# Free no-host worker: a scheduled runner does ONE ingest cycle (scrape -> LLM ->
# ingest -> correlate -> backtest) against Neon, then exits. Replaces an always-on
# worker process. Unlimited minutes on public repos. Off-peak minutes (:13/:43)
# reduce GitHub's start-of-hour scheduling delay.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORLDFIN_DATABASE_URL: ${{ secrets.WORLDFIN_DATABASE_URL }}
      # Endpoint, model and key are set by `make llm` (scripts/llm.py); the heuristic
      # fallback below still covers any LLM outage so events always land.
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FINSCRAPE_WIRE_API: chat
      FINSCRAPE_MODEL: ${{ vars.FINSCRAPE_MODEL }}
      FINSCRAPE_MODEL_FALLBACK: ${{ vars.FINSCRAPE_MODEL_FALLBACK }}
      FINSCRAPE_HEURISTIC_FALLBACK: "true"
      WORLDFIN_WORKER_MAX_ARTICLES: "6"
      WORLDFIN_ENABLE_CORRELATION: "true"
      FINSCRAPE_MARKET_TTL: "900"
      RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      # The locked torch pulls ~3 GB of CUDA wheels on Linux; Laya needs only the CPU build.
      - name: Install dependencies with CPU-only Laya
        run: |
          uv sync -p 3.13 --group server
          uv pip install -p .venv torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -p .venv "laya>=0.3.20"
      # vars.LAYA_RELEASE names the release holding the promoted checkpoint
      # (scripts/laya_train/publish.py); unset runs without Laya.
      - name: Restore Laya checkpoint
        id: laya
        if: vars.LAYA_RELEASE != ''
        uses: actions/cache@v4
        with:
          path: laya-model
          key: ${{ vars.LAYA_RELEASE }}
      - name: Download Laya checkpoint
        if: vars.LAYA_RELEASE != '' && steps.laya.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p laya-model
          gh release download "${{ vars.LAYA_RELEASE }}" -p laya.tar -O - | tar -x -C laya-model
      - name: Run one ingest cycle
        env:
          FINSCRAPE_LAYA: ${{ vars.LAYA_RELEASE != '' && '1' || '0' }}
          FINSCRAPE_LAYA_MODEL: ${{ vars.LAYA_RELEASE != '' && format('{0}/laya-model', github.workspace) || '' }}
        run: uv run --no-sync python -m worker.main --once
      - name: Alert if events stopped or the database is near its cap
        run: uv run --no-sync python scripts/check_prod.py

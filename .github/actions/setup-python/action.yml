name: Python setup
description: uv with its cache, Python 3.14 and the locked dependency groups
inputs:
  groups:
    description: Arguments passed to uv sync
    default: --group server
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.0"
        enable-cache: true
    - run: uv python install 3.14
      shell: bash
    - run: uv sync --locked -p 3.14 ${{ inputs.groups }}
      shell: bash
